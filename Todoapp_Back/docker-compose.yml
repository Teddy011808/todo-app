# PostgreSQL and RabbitMQ for the API. Started automatically by `npm run back` (or `npm run db:up`).
# Values come from .env when it exists, otherwise the defaults after ":-".
name: todo-app

services:
  db:
    image: postgres:16
    container_name: todo-app-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-todo}
    ports:
      # 5433 on your machine, so it never clashes with another Postgres on 5432
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3-management
    container_name: todo-app-rabbitmq
    # RabbitMQ stores messages under its hostname, so it must stay the same
    hostname: rabbitmq
    ports:
      # localhost only: the default guest/guest login must not reach your network
      - '127.0.0.1:5672:5672' # AMQP
      - '127.0.0.1:15672:15672' # Management UI
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  pgdata:
  rabbitmq:
